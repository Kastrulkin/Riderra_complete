version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16-trixie
    ports:
      - "55432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-riderra}
      - POSTGRES_USER=${POSTGRES_USER:-riderra}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-riderra_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://riderra:riderra_local_password@postgres:5432/riderra?schema=public}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SETUP_KEY=${ADMIN_SETUP_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - EASYTAXI_WEBHOOK_SECRET=${EASYTAXI_WEBHOOK_SECRET}
      - OPENCLAW_WEBHOOK_SECRET=${OPENCLAW_WEBHOOK_SECRET}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - EMAIL_TO=${EMAIL_TO}
      - EMAIL_FROM=${EMAIL_FROM}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - GIGACHAT_CLIENT_ID=${GIGACHAT_CLIENT_ID}
      - GIGACHAT_CLIENT_SECRET=${GIGACHAT_CLIENT_SECRET}
      - GIGACHAT_CA_BUNDLE=${GIGACHAT_CA_BUNDLE}
      - GIGACHAT_SSL_VERIFY=${GIGACHAT_SSL_VERIFY:-true}
      - PRICING_EMBEDDINGS_ENABLED=${PRICING_EMBEDDINGS_ENABLED:-false}
      - PRICING_EMBEDDINGS_MODEL=${PRICING_EMBEDDINGS_MODEL:-EmbeddingsGigaR}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
